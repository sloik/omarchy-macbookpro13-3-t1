# 15-inch T1 MacBook Pro: s2idle instead of deep (Radeon does not survive deep resume);
# pcie_port_pm=off keeps the Thunderbolt bridges out of D3 so their ACPI _PS3 never cuts power.
# After nohzafk/omarchy-macbookpro-t1 PR #5 (strawberry-code).
KERNEL_CMDLINE[default]+=" mem_sleep_default=s2idle pcie_port_pm=off"
